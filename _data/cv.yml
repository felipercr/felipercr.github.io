      - company: Télécom SudParis
        position: Research internship
        location: Paris, France
        start_date: 2025
        end_date: 2025
        highlights:
          - Study the reconstruction of physical environments by usage of sound waves.
          - Data engineering with AI, optimization and compressive sensing methods.
          - Signal processing techniques over computational MATLAB simulations.

      - company: University of Jyväskylä
        position: Research internship
        location: Jyväskylä, Finland
        start_date: 2024
        end_date: 2024
        highlights:
          - Characterization of an FPI hyperspectral imaging camera for applications in space, such as asteroid analysis (after NASA’s dart mission).
          - Evaluation of the reliability of the camera’s technology (FPI) through an analysis of a large dataset of hyperspectral images.
          - Presented in the 2024’s IEEE WHISPERS conference. Co-autor of "Lifetime Performance Analysis of a Hyperspectral Imager Based on a Piezoelectrically Tunable Fabry-Perot Interferometer".


      - company: Metrum, Measuring and Testing Equipment
