        location: Belo Horizonte, Brazil
        start_date: 2023
        end_date: 2023
        highlights:
          - Develop embedded firmware and electronic circuits of measuring and testing equipment.
          - Research and validation of electronic circuits for applications in embedded systems.
          - Design PCBs.

      - company: Milhagem UFMG
        position: Electrical engineer
        location: Belo Horizonte, Brazil
        start_date: 2023
        end_date: 2023
        highlights:
          - 1st place in the Shell Eco-Marathon Americas 2023.
          - Make energy-efficient vehicles to participate in the Shell Eco-Marathon competition.
          - Work on the vehicle's electronic system.

      - company: Federal University of Minas Gerais
        position: Peer tutor - Signals and systems
        location: Belo Horizonte, Brazil
        start_date: 2023
        end_date: 2023
        highlights:
          - Assist students on the Analysis of Dynamic Linear Systems course.
          - Explain concepts regarding signals, Fourier, Laplace and Z transforms, filters, dynamic systems, and more.


      - company: Nuclear Technology Development Center (CDTN)
        position: Research internship
        location: Belo Horizonte, Brazil
        start_date: 2021
        end_date: 2022
        highlights:
          - Data analysis of Monte Carlo simulation results from a nuclear reactor, and scripting of automated simulations and calculations.
          - Validation of a method for calculating error of stochastic neutronic simulations.
          - Co-writer of “Investigation of discretization uncertainty in Monte Carlo neutron transport simulations of the Molten Salt Fast Reactor”.

